# XcodeGen: the host app around NsgoPilot.xcframework (go tool nsgo build -embed
# -target ios, copied into Frameworks/) and its resources (NsgoPilotResources/).
# AetherEngine goes into PlayerEngineKit, a dynamic framework of its own, and
# the app links only that: AetherEngine is LGPL-3.0 and ships dynamically
# linked, so the engine can be replaced without rebuilding the app.
name: NsgoPilotHost
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 7.73.0
targets:
  PlayerEngineKit:
    type: framework
    platform: iOS
    sources:
      - path: PlayerEngineKit
    dependencies:
      - package: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laincat.nsgopilot.engine
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  NsgoPilotHost:
    type: application
    platform: iOS
    sources:
      - path: main.swift
      - path: NsgoPilotResources
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/NsgoPilot.xcframework
        embed: false
      - target: PlayerEngineKit
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.laincat.nsgopilot
        SWIFT_VERSION: "5.0"
        OTHER_LDFLAGS: [-lresolv]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed AetherEngine's FFmpeg frameworks
        # SwiftPM builds the package's dynamic frameworks for PlayerEngineKit but
        # embeds none of them in an iOS app, and a framework target has no embed
        # phase of its own: the app carries them, as it would if it linked the
        # package itself.
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          for fw in "$BUILT_PRODUCTS_DIR"/AetherLib*.framework; do
            [ -d "$fw" ] || continue
            rm -rf "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/$(basename "$fw")"
            cp -R "$fw" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
            [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/$(basename "$fw")"
          done
          true
        basedOnDependencyAnalysis: false


